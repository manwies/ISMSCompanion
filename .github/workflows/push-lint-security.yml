name: Security & Lint Check

# Runs on pull requests only. Branch protection on main must require these
# checks and an up-to-date branch, so the PR run covers the merge result.
# Required status checks: "Format & Lint Check", "Tests (pytest)",
# "Security Scan (Bandit)". "Tests (pytest)" is the aggregate gate job.
on:
  pull_request:
    branches: [main]

# Least privilege: jobs only need to read the repository
permissions:
  contents: read

# Cancel superseded runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "~3.11.4"
          cache: "pip"

      - name: Upgrade pip/setuptools/wheel
        run: pip install --upgrade pip setuptools

      - name: Install Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          # CVE-2025-8869: False Positive - Python 3.11.13 implements PEP 706
          # Skip editable installs (local ismscompanion package)
          pip-audit --skip-editable --ignore-vuln GHSA-4xh5-x5gv-qwph --desc

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Ruff Lint
        run: ruff check . --output-format=github

      - name: mypy Type Check
        run: mypy src/

  test-matrix:
    name: Tests (pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Experimental versions must not block merges
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.15"
            experimental: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip/setuptools/wheel
        run: pip install --upgrade pip setuptools

      - name: Install Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest --cov=src --cov-report=term-missing

  # Stable aggregate gate: keeps a single required check name independent of
  # the matrix contents.
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-matrix
    if: ${{ always() }}
    steps:
      - name: Verify matrix result
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Test matrix result: $MATRIX_RESULT"
            exit 1
          fi

  security-scan:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Upgrade pip/setuptools/wheel
        run: pip install --upgrade pip setuptools

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit Security Scan
        # Fail on medium severity and above; report is uploaded in any case
        run: bandit -r src/ -ll -f json -o bandit-report.json

      - name: Upload Bandit Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
