name: Security & Lint Check

# Runs on pull requests only. Branch protection on main must require these
# checks and an up-to-date branch, so the PR run covers the merge result.
# Required status checks: "Format & Lint Check", "Tests (pytest)",
# "Security Scan (Bandit)", "Package Build Check". "Tests (pytest)" is the
# aggregate gate job.
on:
  pull_request:
    branches: [main]

# Least privilege: jobs only need to read the repository
permissions:
  contents: read

# Cancel superseded runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python (primary version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Upgrade pip/setuptools/wheel
        run: pip install --upgrade pip setuptools

      - name: Install Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          # Skip editable installs (local ismscompanion package)
          # Add an --ignore-vuln entry only together with a documented review date
          pip-audit --skip-editable --desc

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Ruff Lint
        run: ruff check . --output-format=github

      # mypy and ruff target the minimum supported version (see pyproject.toml)
      # so that syntax unsupported by that version is reported.
      - name: mypy Type Check
        run: mypy src/ scripts/

  test-matrix:
    name: Tests (pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Experimental versions must not block merges
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.15"
            experimental: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip/setuptools/wheel
        run: pip install --upgrade pip setuptools

      - name: Install Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest --cov=ismscompanion --cov-report=term-missing

  # Stable aggregate gate: keeps a single required check name independent of
  # the matrix contents.
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-matrix
    if: ${{ always() }}
    steps:
      - name: Verify matrix result
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Test matrix result: $MATRIX_RESULT"
            exit 1
          fi

  security-scan:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python (primary version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"

      - name: Upgrade pip/setuptools/wheel
        run: pip install --upgrade pip setuptools

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit Security Scan
        # Fail on medium severity and above; report is uploaded in any case
        run: bandit -r src/ scripts/ -ll -f json -o bandit-report.json

      - name: Upload Bandit Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  package-build:
    name: Package Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python (primary version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ".python-version"

      - name: Check version consistency
        run: python scripts/check_version_consistency.py

      - name: Install build tools
        run: pip install build==1.6.1 twine==7.0.0

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required = {
              "ismscompanion/__init__.py",
              "ismscompanion/core/__init__.py",
              "ismscompanion/core/security/__init__.py",
              "ismscompanion/core/security/crypto_config.py",
              "ismscompanion/core/security/exceptions.py",
          }
          top_level = {name.split("/", 1)[0] for name in names}
          unexpected = sorted(
              entry
              for entry in top_level
              if entry != "ismscompanion" and not entry.endswith(".dist-info")
          )
          missing = sorted(required - names)
          if missing or unexpected:
              sys.exit(f"Wheel check failed: missing={missing} unexpected={unexpected}")
          print(f"Wheel check passed: {wheel.name}")
          PY
